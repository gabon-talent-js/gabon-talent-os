<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Détail de l'offre · Gabon Talent OS</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{--ink:#0f2a1d;--green:#0b7a4b;--sun:#f2b705;--paper:#f6f7f4}
  body{background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{background:#fff;border:1px solid #e1e6df;border-radius:1.1rem;padding:1.25rem}
  .field{border:1px solid #d5dbd3;border-radius:.6rem;padding:.55rem .7rem;width:100%;background:#fff}
  .field:focus-visible{outline:2px solid var(--sun);outline-offset:1px}
  label{font-size:.85rem;font-weight:600;display:block}
  .cta{display:block;width:100%;text-align:center;border-radius:.8rem;padding:.85rem 1rem;font-weight:700;background:var(--green);color:#fff}
  .cta:disabled{opacity:.55}
</style>
</head>
<body class="min-h-screen">
<main class="max-w-xl mx-auto px-4 py-8">
  <a href="index.html#/tarifs" class="text-sm underline text-green-800">← Tous les tarifs</a>
  <div id="detail" class="card mt-4"><p class="text-slate-500">Chargement…</p></div>
  <form id="f" class="card mt-4 hidden" novalidate>
    <h2 class="font-bold">Vos informations</h2>
    <p class="text-xs text-slate-500 mt-1">Ces informations servent à activer votre abonnement et à vous contacter.</p>
    <div class="grid gap-3 mt-3">
      <div><label>Prénom *</label><input class="field" name="prenom" autocomplete="given-name"></div>
      <div><label>Nom *</label><input class="field" name="nom" autocomplete="family-name"></div>
      <div id="rowEnt"><label>Entreprise *</label><input class="field" name="entreprise" autocomplete="organization"></div>
      <div><label id="lblMail">E-mail *</label><input class="field" type="email" name="email" autocomplete="email">
        <p id="mailHint" class="text-xs text-slate-500 mt-1"></p></div>
      <div><label>WhatsApp * (ex: +241 74 99 57 45)</label><input class="field" type="tel" name="whatsapp" value="+241 " autocomplete="tel"></div>
      <label class="flex gap-2 font-normal text-sm"><input id="consent" type="checkbox" class="mt-1"> J'accepte que ces informations soient utilisées pour traiter mon abonnement et me contacter.</label>
    </div>
    <p id="err" class="text-sm text-red-600 mt-3 hidden" role="alert"></p>
    <button type="submit" id="go" class="cta mt-5"></button>
    <p class="text-xs text-slate-500 mt-3">Paiement sécurisé sur Chariow. Après le paiement, vous êtes ramené sur le site et votre abonnement s'active automatiquement.</p>
  </form>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const db = getFirestore(initializeApp({ apiKey: "AIzaSyATIRQfPyhvPFp1dIvil3zk4axejA_1q70", authDomain: "gabon-talent-os.firebaseapp.com", projectId: "gabon-talent-os" }));
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const q = new URLSearchParams(location.search);
const KIND = q.get("produit") ? "formation" : "pack";
const ID = q.get("produit") || q.get("id") || "";
let prod = null, api = "";
const err = (m) => { $("err").textContent = m || ""; $("err").classList.toggle("hidden", !m); };

(async () => {
  try {
    const [p, s] = await Promise.all([
      ID ? getDoc(doc(db, KIND === "pack" ? "config_packs" : "config_produits", ID)) : null,
      getDoc(doc(db, "config_site", "main"))
    ]);
    api = s.exists() ? String(s.data().urlPaiement || "") : "";
    if(!p || !p.exists()) return fail();
    prod = p.data();
    const dispo = KIND === "pack" ? prod.actif !== false : prod.actif === true;
    if(!dispo) return fail();
    const gratuit = !(Number(prod.prix) > 0);
    const lien = /^https:\/\//i.test(prod.lienPaiement || "") ? prod.lienPaiement : "";
    document.title = (prod.nom || ID) + " · Gabon Talent OS";
    const infos = [];
    if(prod.duree) infos.push("Durée : " + esc(prod.duree) + " jours");
    if(KIND === "pack" && prod.maxOffres) infos.push(prod.maxOffres >= 1000 ? "Offres illimitées" : "Jusqu'à " + esc(prod.maxOffres) + " offre(s)");
    const feats = (prod.features || []).map(f => `<li class="flex gap-2"><span style="color:var(--green)" aria-hidden="true">✓</span><span>${esc(f)}</span></li>`).join("");
    $("detail").innerHTML = `
      <h1 class="text-2xl font-extrabold">${esc(prod.nom || ID)}</h1>
      <div class="text-4xl font-extrabold mt-2">${gratuit ? "Gratuit" : Number(prod.prix).toLocaleString("fr-FR") + ' <span class="text-base font-semibold">FCFA</span>'}</div>
      ${infos.length ? `<p class="text-sm text-slate-500 mt-1">${infos.join(" · ")}</p>` : ""}
      ${prod.description ? `<p class="mt-4">${esc(prod.description)}</p>` : ""}
      ${feats ? `<h2 class="font-bold mt-4">Ce qui est inclus</h2><ul class="mt-2 space-y-2 text-sm">${feats}</ul>` : ""}
      <h2 class="font-bold mt-4">Comment ça se passe</h2>
      <ol class="mt-2 text-sm list-decimal pl-5 space-y-1"><li>Vous renseignez vos informations ci-dessous.</li><li>Vous payez en toute sécurité sur Chariow.</li><li>${KIND === "pack" ? "Votre pack s'active automatiquement : vous pouvez publier vos offres." : (ID.startsWith("ads_") ? "Notre équipe vous contacte sur WhatsApp pour recevoir votre visuel et lancer la diffusion." : "Vous êtes inscrit et l'équipe vous contacte sur WhatsApp.")}</li></ol>`;
    if(gratuit){
      $("detail").insertAdjacentHTML("beforeend", `<a class="cta mt-5" href="index.html#/recruteur">Commencer gratuitement</a>`);
      return;
    }
    if(!api && !lien){
      $("detail").insertAdjacentHTML("beforeend", `<p class="mt-5 text-sm font-semibold">Le paiement en ligne sera bientôt disponible.</p>`);
      return;
    }
    if(KIND !== "pack" && !ID.startsWith("ads_")) $("rowEnt").classList.add("hidden");
    $("lblMail").textContent = KIND === "pack" ? "E-mail professionnel *" : "E-mail *";
    $("mailHint").textContent = KIND === "pack" ? "Utilisez la même adresse que pour publier vos offres : c'est elle qui est rattachée à votre pack." : "";
    $("go").textContent = (KIND === "pack" ? "S'abonner au pack" : ID.startsWith("ads_") ? "Réserver mon annonce" : "S'inscrire") + " · " + Number(prod.prix).toLocaleString("fr-FR") + " FCFA";
    $("f").classList.remove("hidden");
  } catch(e){ console.error(e); fail(); }
})();
function fail(){ $("detail").innerHTML = `<p>Cette offre n'existe pas ou n'est plus disponible. <a class="underline text-green-800" href="index.html#/tarifs">Voir les tarifs</a></p>`; }

$("f").addEventListener("submit", async (e) => {
  e.preventDefault(); err("");
  const v = (n) => $("f").querySelector(`[name=${n}]`).value.trim();
  const data = { type: KIND, produit: ID, prenom: v("prenom"), nom: v("nom"), entreprise: v("entreprise"), email: v("email").toLowerCase(), whatsapp: v("whatsapp") };
  if(!data.prenom || !data.nom || ((KIND === "pack" || ID.startsWith("ads_")) && !data.entreprise)) return err("Merci de remplir tous les champs marqués *.");
  if(!/^\S+@\S+\.\S+$/.test(data.email)) return err("Adresse e-mail invalide.");
  if(data.whatsapp.replace(/\D/g, "").length < 9) return err("Numéro WhatsApp invalide.");
  if(!$("consent").checked) return err("Veuillez accepter le consentement.");
  const btn = $("go"), old = btn.textContent;
  btn.disabled = true; btn.textContent = "Redirection vers le paiement…";
  const lien = /^https:\/\//i.test(prod.lienPaiement || "") ? prod.lienPaiement : "";
  try {
    if(api){
      const r = await fetch(api, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
      const j = await r.json().catch(() => ({}));
      if(r.ok && /^https:\/\//i.test(j.checkout_url || "")){ location.href = j.checkout_url; return; }
      if(!lien) throw new Error(j.error || "Paiement indisponible");
    }
    if(lien){ location.href = lien; return; }   // mode de secours : lien direct (activation manuelle)
    throw new Error("Paiement indisponible");
  } catch(ex){ err(ex.message || "Paiement indisponible. Réessayez."); btn.disabled = false; btn.textContent = old; }
});
</script>
</body>
</html>
