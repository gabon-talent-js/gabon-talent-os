<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Merci · Gabon Talent OS</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>:root{--ink:#0f2a1d;--green:#0b7a4b;--paper:#f6f7f4}body{background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.card{background:#fff;border:1px solid #e1e6df;border-radius:1.1rem;padding:1.5rem}.cta{display:block;text-align:center;border-radius:.8rem;padding:.8rem 1rem;font-weight:700;background:var(--green);color:#fff}</style>
</head>
<body class="min-h-screen">
<main class="max-w-xl mx-auto px-4 py-12">
  <div class="card text-center">
    <div class="text-5xl" aria-hidden="true">✅</div>
    <h1 class="text-2xl font-extrabold mt-3">Merci pour votre paiement !</h1>
    <p id="msg" class="mt-3 text-slate-600">Nous vérifions votre paiement. Votre pack sera activé dans quelques minutes et vous serez prévenu.</p>
    <a id="wa" class="cta mt-6 hidden" target="_blank" rel="noopener">Nous écrire sur WhatsApp</a>
    <a class="cta mt-3" style="background:var(--ink)" href="index.html">Retour à l'accueil</a>
  </div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const db = getFirestore(initializeApp({ apiKey: "AIzaSyATIRQfPyhvPFp1dIvil3zk4axejA_1q70", authDomain: "gabon-talent-os.firebaseapp.com", projectId: "gabon-talent-os" }));
if(new URLSearchParams(location.search).get("type") === "cv") document.getElementById("msg").textContent = "Merci ! Patientez quelques instants : votre CV est en cours de génération et vous sera envoyé par email et par WhatsApp.";
try {
  const s = await getDoc(doc(db, "config_site", "main"));
  const n = String((s.exists() && s.data().whatsapp) || "").replace(/\D/g, "");
  if(n){ const a = document.getElementById("wa"); a.href = "https://wa.me/" + n + "?text=" + encodeURIComponent("Bonjour, je viens de payer mon pack sur Gabon Talent OS."); a.classList.remove("hidden"); }
} catch(e){ console.warn(e); }
</script>
</body>
</html>
