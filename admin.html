<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin V3 - FIXED</title><style>:root{--bg:#0f2415;--gold:#ffcc00;--line:#e5e7eb;--red:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f6f7f4}.header{background:var(--bg);color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.badge{background:var(--gold);color:var(--bg);padding:4px 10px;border-radius:999px;font-weight:900;font-size:12px}.wrap{max-width:1150px;margin:0 auto;padding:18px;display:grid;gap:18px}.grid{display:grid;gap:18px;grid-template-columns:1.2fr.8fr}@media(max-width:900px){.grid{grid-template-columns:1fr}}.box{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}.box h2{margin:0;padding:14px 16px;border-bottom:1px solid var(--line);font-size:15px;background:#fafaf7}.content{padding:16px}label{font-size:11px;font-weight:800;color:#374151;display:block;margin:10px 0 5px;text-transform:uppercase}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:14px}textarea{min-height:110px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}@media(max-width:600px){.row,.row3{grid-template-columns:1fr}}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.btn-gold{background:var(--gold);color:var(--bg);width:100%}.btn-ghost{background:white;border:1px solid var(--line)}.btn-danger{background:var(--red);color:white}.btn-sm{padding:7px 10px;font-size:12px}.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi div{background:white;border:1px dashed var(--line);border-radius:12px;padding:10px;text-align:center}table{width:100%;border-collapse:collapse}th{font-size:10px;text-transform:uppercase;color:#6b7280;padding:8px;border-bottom:1px solid var(--line);text-align:left}td{padding:8px;border-bottom:1px solid #f3f4f6;font-size:13px}#login{position:fixed;inset:0;background:rgba(15,36,21,.95);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}.login-card{background:white;border-radius:18px;max-width:380px;width:100%;padding:20px}.success{background:#dcfce7;border:1px solid #bbf7d0;color:#166534;padding:10px;border-radius:10px;font-size:12px;margin-top:10px}</style></head><body><div class="header"><h1 style="margin:0;font-size:17px">Admin V3 - FIXED</h1><div><span class="badge" id="countBadge">0 OFFRES</span> <button class="btn btn-ghost btn-sm" onclick="location.href='./'">Voir site</button></div></div><div id="login"><div class="login-card"><h3 style="margin:0">Acces Admin - CORRIGE</h3><p style="font-size:12px;color:#6b7280">Config ligne 553 integree. MDP: <b>gabon2026</b></p><label>Mot de passe</label><input id="pwd" type="text" value="gabon2026"><button class="btn btn-gold" style="margin-top:12px" onclick="doLogin()">Entrer</button><button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="forceLogin()">Forcer l'entree</button><p id="loginErr" style="display:none;color:red;font-size:12px"></p><div id="fbStatus" class="success">Firebase OK: gabon-talent-os</div></div></div><div class="wrap"><div class="kpi"><div><b id="kpiTotal">0</b><br><small>TOTAL</small></div><div><b id="kpiActive">0</b><br><small>ACTIVES</small></div><div><b id="kpiToday">0</b><br><small>AUJOURD'HUI</small></div></div><div class="grid"><div class="box"><h2>Ajouter une offre</h2><div class="content"><form onsubmit="return false"><input type="hidden" id="docId"><label>Titre *</label><input id="title"><div class="row"><div><label>Entreprise *</label><input id="company"></div><div><label>Secteur</label><select id="sector"><option>Banque / Finance</option><option>Petrole & Gaz</option><option>BTP / Construction</option><option>Commerce / Vente</option><option>Informatique / IT</option><option>Education</option><option>Sante</option><option>Telecom</option><option>Transport / Logistique</option><option>Autre</option></select></div></div><div class="row3"><div><label>Province</label><select id="province"><option>Estuaire</option><option>Haut-Ogooue</option><option>Moyen-Ogooue</option><option>Ngounie</option><option>Nyanga</option><option>Ogooue-Ivindo</option><option>Ogooue-Lolo</option><option>Ogooue-Maritime</option><option>Woleu-Ntem</option></select></div><div><label>Ville *</label><input id="city" value="Libreville"></div><div><label>Type</label><select id="type"><option>CDI</option><option>CDD</option><option>Stage</option><option>Freelance</option><option>Alternance</option></select></div></div><label>Description *</label><textarea id="description"></textarea><div class="row"><div><label>Email / Lien</label><input id="applyLink"></div><div><label>Salaire</label><input id="salary"></div></div><div style="margin-top:10px"><label><input type="checkbox" id="active" checked> Active</label> <label><input type="checkbox" id="featured"> Mise en avant</label></div><button class="btn btn-gold" onclick="saveOffer()">PUBLIER</button><button class="btn btn-ghost" onclick="resetForm()" style="width:100%;margin-top:8px">Annuler</button></form></div></div><div class="box"><h2>Offres <small id="filterInfo"></small></h2><div class="content"><input id="search" placeholder="Rechercher..." oninput="renderTable()" style="margin-bottom:8px"><div style="overflow:auto;max-height:700px"><table><thead><tr><th>Titre</th><th>Actions</th></tr></thead><tbody id="tbody"></tbody></table></div><div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" onclick="exportJSON()">Export</button><button class="btn btn-ghost btn-sm" onclick="document.getElementById('importFile').click()">Import JSON</button><input type="file" id="importFile" hidden accept=".json" onchange="importJSON(event)"><button class="btn btn-danger btn-sm" onclick="deleteAll()">Tout supprimer</button></div></div></div></div></div><script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";const firebaseConfig = {apiKey: "AIzaSyATIRQPYhVPFpId1v13zk4axeJA_IQ70",authDomain: "gabon-talent-os.firebaseapp.com",projectId: "gabon-talent-os",storageBucket: "gabon-talent-os.firebasestorage.app",messagingSenderId: "66563433244",appId: "1:66563433244:web:1c6e82435544d7a839ee59",measurementId: "G-7FVW7XZMC"};let db=null;try{const app=initializeApp(firebaseConfig);db=getFirestore(app)}catch(e){alert("Firebase erreur: "+e.message)}const ADMIN_PWD="gabon2026";window.doLogin=()=>{const v=document.getElementById('pwd').value.trim().toLowerCase();if(v==="gabon2026"){document.getElementById('login').style.display='none';localStorage.setItem('gt_admin','1');init()}else{const err=document.getElementById('loginErr');err.style.display='block';err.textContent="Mauvais mdp"}};window.forceLogin=()=>{document.getElementById('login').style.display='none';localStorage.setItem('gt_admin','1');init()};if(localStorage.getItem('gt_admin')==='1'){document.getElementById('login').style.display='none'}let OFFERS=[];function init(){if(!db){alert("Firebase non init");return}const q=query(collection(db,"offers"),orderBy("createdAt","desc"));onSnapshot(q,snap=>{OFFERS=snap.docs.map(d=>({id:d.id,...d.data()}));updateKpi();renderTable()},err=>{alert("Firestore erreur: "+err.message+"\\nVa dans Firebase Console > Firestore > Regles et mets: allow read, write: if true;")})}function updateKpi(){document.getElementById('kpiTotal').textContent=OFFERS.length;document.getElementById('kpiActive').textContent=OFFERS.filter(o=>o.active!==false).length;document.getElementById('kpiToday').textContent=OFFERS.filter(o=>{if(!o.createdAt) return 0;const d=o.createdAt.toDate?o.createdAt.toDate():new Date(o.createdAt);return d.toDateString()===new Date().toDateString()}).length;document.getElementById('countBadge').textContent=OFFERS.length+" OFFRES";document.getElementById('filterInfo').textContent="("+OFFERS.length+")"}window.renderTable=()=>{const s=document.getElementById('search').value.toLowerCase();const tbody=document.getElementById('tbody');let list=OFFERS.filter(o=>!s||(o.title+o.company+o.city).toLowerCase().includes(s));tbody.innerHTML=list.map(o=>`<tr><td><b>${o.title}</b><br><small>${o.company} - ${o.city}</small></td><td><button class="btn btn-ghost btn-sm" onclick="editOffer('${o.id}')">Edit</button> <button class="btn btn-danger btn-sm" onclick="delOffer('${o.id}')">X</button></td></tr>`).join('')||'<tr><td colspan=2 style="text-align:center;padding:20px;color:#999">0 offre</td></tr>'};window.saveOffer=async()=>{if(!db) return alert("Firebase non configure");const data={title:document.getElementById('title').value.trim(),company:document.getElementById('company').value.trim(),sector:document.getElementById('sector').value,province:document.getElementById('province').value,city:document.getElementById('city').value.trim(),type:document.getElementById('type').value,description:document.getElementById('description').value.trim(),applyLink:document.getElementById('applyLink').value.trim(),salary:document.getElementById('salary').value.trim(),active:document.getElementById('active').checked,featured:document.getElementById('featured').checked,createdAt:serverTimestamp(),source:"admin-v3"};if(!data.title||!data.company||!data.description) return alert("Remplis Titre Entreprise Description");const id=document.getElementById('docId').value;try{if(id){await updateDoc(doc(db,"offers",id),{...data,createdAt:undefined});alert("Modifiee")}else{await addDoc(collection(db,"offers"),data);alert("Publiee!")}resetForm()}catch(e){alert("Erreur: "+e.message)}};window.editOffer=(id)=>{const o=OFFERS.find(x=>x.id===id);if(!o) return;document.getElementById('docId').value=o.id;document.getElementById('title').value=o.title||'';document.getElementById('company').value=o.company||'';document.getElementById('sector').value=o.sector||'Banque / Finance';document.getElementById('province').value=o.province||'Estuaire';document.getElementById('city').value=o.city||'';document.getElementById('type').value=o.type||'CDI';document.getElementById('description').value=o.description||'';document.getElementById('applyLink').value=o.applyLink||'';document.getElementById('salary').value=o.salary||'';document.getElementById('active').checked=o.active!==false;document.getElementById('featured').checked=!!o.featured;window.scrollTo({top:0,behavior:'smooth'})};window.resetForm=()=>{document.getElementById('docId').value='';document.getElementById('title').value='';document.getElementById('company').value='';document.getElementById('description').value=''};window.delOffer=async(id)=>{if(!confirm("Supprimer?")) return;await deleteDoc(doc(db,"offers",id))};window.deleteAll=async()=>{if(!confirm("SUPPRIMER TOUT?")) return;if(prompt("Tape SUPPRIMER")!=="SUPPRIMER") return;for(const o of OFFERS){await deleteDoc(doc(db,"offers",o.id))}};window.exportJSON=()=>{const blob=new Blob([JSON.stringify(OFFERS,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='offers.json';a.click()};window.importJSON=async(e)=>{const file=e.target.files[0];if(!file) return;const text=await file.text();try{const arr=JSON.parse(text);for(const o of arr){const {id,createdAt,...rest}=o;await addDoc(collection(db,"offers"),{...rest,createdAt:serverTimestamp()})}alert("Importe "+arr.length+" offres")}catch(err){alert("JSON invalide: "+err.message)}};if(localStorage.getItem('gt_admin')==='1'){init()}</script></body></html>
