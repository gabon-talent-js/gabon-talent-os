<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gabon Talent OS</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}body{background:#f6f7f9}
header{background:#0b0f1a;color:#fff;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.btn{padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;text-decoration:none}
.btn1{background:#1f2937;color:#fff}.btn2{background:#5eead4;color:#0b0f1a}
.hero{text-align:center;padding:48px 16px 10px}.hero h1{font-size:38px;font-weight:900;line-height:1.05;letter-spacing:-1px}
.hero p{color:#64748b;margin-top:10px;font-size:14px}
.search{max-width:860px;margin:22px auto;background:#fff;border:1px solid #e5e7eb;border-radius:16px;display:flex;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.07)}
.search input{flex:1;border:0;outline:0;padding:14px;font-size:14px}.search button{background:#0f766e;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700}
.grid{max-width:1200px;margin:20px auto;padding:0 16px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:#fff;border:1px solid #eef2f7;border-radius:18px;padding:16px;box-shadow:0 6px 20px rgba(0,0,0,.05)}
.top{display:flex;justify-content:space-between}.logoC{width:44px;height:44px;border-radius:10px;background:#f1f5f9;display:grid;place-items:center;font-weight:800;font-size:13px}
.badge{font-size:11px;padding:4px 8px;border-radius:99px;font-weight:700}.n{background:#dcfce7;color:#166534}.f{background:#dbeafe;color:#1e40af}.u{background:#ffedd5;color:#9a3412}
.t{font-weight:800;margin-top:12px;font-size:16px}.tag{display:inline-block;font-size:11px;border:1px solid #e5e7eb;background:#f8fafc;padding:5px 9px;border-radius:99px;margin-top:8px;margin-right:6px}
.loc{font-size:12px;color:#64748b;margin-top:10px}.pay{font-size:13px;font-weight:700;margin-top:8px;border-top:1px solid #f1f5f9;padding-top:8px}
.foot{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:#94a3b8}.apply{background:#f1f5f9;padding:6px 10px;border-radius:8px;color:#0f172a;text-decoration:none;font-weight:700}
</style></head>
<body>
<header><b>🇬🇦 Gabon Talent OS</b><div><a class="btn btn1" href="candidat.html">Candidat</a> <a class="btn btn2" href="recruteur.html">Poster +</a></div></header>
<div class="hero"><h1>Toutes les offres du Gabon.<br><span style="color:#0f766e">En un seul endroit.</span></h1><p>8 offres vérifiées • Scanné Facebook, LinkedIn, Emploi.ga • MAJ 07:00</p>
<div class="search"><input id="q" placeholder="Rechercher poste, entreprise..." oninput="filter()"><button onclick="filter()">Search</button></div></div>
<div id="grid" class="grid"></div>
<script>
const JOBS=[
{id:"1",title:"Comptable Senior - Sobraga",company:"Sobraga",loc:"Libreville",type:"CDI",cat:"Finance",badge:"New",pay:"3.5 — 5.2M XAF / an",date:"03 Oct"},
{id:"2",title:"Développeur Web Fullstack",company:"Mbighe Technologie",loc:"Libreville",type:"CDI",cat:"Tech",badge:"Featured",pay:"2.8 — 4.5M XAF / an",date:"04 Oct"},
{id:"3",title:"Chargé RH - PNPE",company:"PNPE",loc:"Port-Gentil",type:"CDD",cat:"RH",badge:"Urgent",pay:"2.0 — 3.0M XAF / an",date:"03 Oct"},
{id:"4",title:"Commercial Terrain",company:"Solsem Afrique",loc:"Franceville",type:"CDI",cat:"Commercial",badge:"New",pay:"1.5 — 2.8M XAF / an",date:"02 Oct"},
{id:"5",title:"Stagiaire Marketing Digital",company:"CCTI",loc:"Libreville",type:"Stage",cat:"Marketing",badge:"Featured",pay:"500k — 800k XAF / an",date:"01 Oct"},
{id:"6",title:"Technicien Maintenance",company:"Sobraga",loc:"Owendo",type:"CDI",cat:"Technique",badge:"Urgent",pay:"1.8 — 2.5M XAF / an",date:"30 Sep"},
{id:"7",title:"Assistante de Direction",company:"Ministère FP",loc:"Libreville",type:"CDD",cat:"Administratif",badge:"New",pay:"2.2 — 3.1M XAF / an",date:"29 Sep"},
{id:"8",title:"Agent Call Center",company:"Airtel Gabon",loc:"Libreville",type:"CDI",cat:"Service Client",badge:"Featured",pay:"1.2 — 1.8M XAF / an",date:"28 Sep"}
];
function render(list){document.getElementById('grid').innerHTML=list.map(j=>`
<div class="card" onclick="location.href='offre.html?id=${j.id}'">
<div class="top"><div style="display:flex;gap:10px;align-items:center"><div class="logoC">${j.company.slice(0,2).toUpperCase()}</div><div><b style="font-size:13px">${j.company}</b><div style="font-size:11px;color:#64748b">${j.cat}</div></div></div><span class="badge ${j.badge=='New'?'n':j.badge=='Featured'?'f':'u'}">${j.badge}</span></div>
<div class="t">${j.title}</div>
<div><span class="tag">${j.cat}</span><span class="tag">${j.type}</span></div>
<div class="loc">📍 ${j.loc} • ${j.type}</div>
<div class="pay">💵 ${j.pay}</div>
<div class="foot"><span>Posted ${j.date}</span><span class="apply">Apply →</span></div>
</div>`).join('')}
function filter(){let q=document.getElementById('q').value.toLowerCase();render(JOBS.filter(j=>j.title.toLowerCase().includes(q)||j.company.toLowerCase().includes(q)))}
render(JOBS);
</script>
</body></html>
