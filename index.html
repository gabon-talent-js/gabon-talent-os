<script>
const PAYMENT_LINKS = {
  CV_1000: "https://wgswpgri.mychariow.com/prd_1avtsfwc/checkout",

  ENTREPRISE_2500: "https://wgswpgri.mychariow.com/prd_d40es2g3/checkout"
};

function pay(type){
  localStorage.setItem('gt_pending_product', type);
  window.open(PAYMENT_LINKS[type], '_blank');
}

function checkPaymentSuccess(){
  const params = new URLSearchParams(window.location.search);
  const isSuccess = params.get('payment')==='success' || params.get('status')==='paid' || localStorage.getItem('gt_paid')==='true';
  if(params.get('payment')==='success'){
    localStorage.setItem('gt_paid','true');
    localStorage.setItem('gt_product', params.get('product')|| localStorage.getItem('gt_pending_product') || 'CV_1000');
    window.history.replaceState({}, document.title, "/gabon-talent-os/");
  }
  if(isSuccess){ unlockCV(); }
}
function unlockCV(){
  document.getElementById('paywall-cv').style.display='none';
  document.getElementById('cv-generator-section').style.display='block';
  document.getElementById('paid-product-label').innerText = localStorage.getItem('gt_product') || 'CV_1000';
  showTab('candidat');
}
function forceUnlock(){
  if(confirm("Confirme que tu as payé sur Chariow?")){
    localStorage.setItem('gt_paid','true');
    localStorage.setItem('gt_product', localStorage.getItem('gt_pending_product')||'CV_1000');
    unlockCV();
  }
}
window.addEventListener('load', checkPaymentSuccess);

function generateCV(){
  const nom=document.getElementById('cv-nom').value, tel=document.getElementById('cv-tel').value, metier=document.getElementById('cv-metier').value, exp=document.getElementById('cv-exp').value;
  if(!nom||!tel){alert('Remplis nom et tel');return}
  document.getElementById('cv-output').innerHTML = `
    <div style="border:1px solid #000;padding:20px;background:white">
    <h2>${nom}</h2><p>${metier} | ${tel}</p><hr style="margin:10px 0">
    <h4>Expériences</h4><p style="white-space:pre-wrap">${exp}</p>
    <p style="margin-top:20px;font-size:11px;color:#666">CV généré par Gabon Talent OS - ${new Date().toLocaleDateString()}</p>
    </div>
    <button class="btn btn-dark" style="width:100%;margin-top:10px" onclick="window.print()">📄 Télécharger / Imprimer PDF</button>
  `;
}

// DEPOT CV
document.getElementById('cv-depot-form').addEventListener('submit', function(e){
  e.preventDefault();
  const nom=document.getElementById('depot-nom').value;
  document.getElementById('depot-msg').innerHTML = "✅ Merci "+nom+"! CV reçu. Recruteurs notifiés.";
  // TODO: brancher Google Sheet / n8n / Telegram ici

});

  const j = JOBS.find(x=>x.id==id);
  document.getElementById('modal-content').innerHTML = `
