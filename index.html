<style>

body{background:#f6f7f9;color:#0b1120}
header{background:#0b0f1a;color:#fff;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}

.btn-teal{background:#5eead4;color:#0b1120}

.hero h1{font-size:42px;line-height:1.05;letter-spacing:-1.2px;font-weight:800}

.search{max-width:860px;margin:26px auto;background:#fff;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.08);display:flex;align-items:center;padding:8px;gap:8px;border:1px solid #e5e7eb}

<header><div class="logo"><i></i> Gabon Talent OS</div><div style="display:flex;gap:10px"><a href="candidat.html" class="btn" style="background:#1f2937;color:#fff">Sign in</a><a href="recruteur.html" class="btn btn-teal">Post a Job +</a></div></header>
<div class="hero"><h1>Discover top opportunities<br>across Gabon</h1><p>Build your future — vetted roles, local impact, global standards. <b id="count">8 open roles</b> • Verified employers • MAJ 07:00</p>
<div class="search"><input id="q" placeholder="Search jobs, skills, or companies"><div class="sep"></div><input id="loc" value="Libreville, Gabon" style="max-width:200px"><button onclick="doSearch()">Search jobs</button></div>
<div class="filters"><span class="chip">Popular filters:</span><span class="chip">🌐 Remote</span><span class="chip">💼 Full-time</span><span class="chip">💻 Engineering</span><span class="chip">📈 Finance</span></div>
</div>
<div id="jobs" class="grid"></div>
<script>
let all=[];
async function load(){const r=await fetch('./data/jobs.json?v='+Date.now());const d=await r.json();all=d.map((j,i)=>({...j,salary:j.salary||`${(2+i*0.5).toFixed(1)} — ${(3.5+i*0.5).toFixed(1)}M XAF / yr`,badge:j.badge||['New','Featured','Urgent'][i%3]}));document.getElementById('count').innerText=all.length+' open roles';render(all)}
function render(list){document.getElementById('jobs').innerHTML=list.map(j=>`
<a href="offre.html?id=${j.id}" style="text-decoration:none;color:inherit"><div class="card">
<div class="top"><div style="display:flex;gap:12px;align-items:center"><div class="logoCo">${j.company.slice(0,2).toUpperCase()}</div><div><div style="font-weight:700">${j.company}</div><div style="font-size:12px;color:#64748b">${j.category}</div></div></div><span class="badge ${j.badge==='New'?'b-new':j.badge==='Featured'?'b-feat':'b-urg'}">${j.badge}</span></div>
<div class="title">${j.title}</div>
<div class="tags"><span class="tag">${j.category}</span><span class="tag">${j.type}</span></div>
<div class="loc">📍 ${j.location} • ${j.type}</div>
<div class="pay">💵 ${j.salary}</div>
<div class="foot"><span>Posted ${j.date}</span><span class="apply">Apply →</span></div>
</div></a>`).join('')}
function doSearch(){const q=document.getElementById('q').value.toLowerCase();render(all.filter(j=>j.title.toLowerCase().includes(q)||j.company.toLowerCase().includes(q)))}
load();
</script>
