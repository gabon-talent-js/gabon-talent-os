<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gabon Talent OS – Offres d'emploi au Gabon, CV et formation</title>
<meta name="description" content="Toutes les offres d'emploi du Gabon dans les 9 provinces. Postulez, publiez une offre, boostez votre CV et formez-vous aux métiers du numérique.">
<meta name="theme-color" content="#0b6b4a">
<style>
:root{--green:#0b6b4a;--green2:#0e8a60;--bg:#f4f7f5;--card:#fff;--text:#0f221b;--muted:#6b7d75;--line:#e3ebe7}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.logo{display:flex;gap:10px;align-items:center;font-weight:900}
.badge{background:var(--green);color:#fff;padding:2px 8px;border-radius:999px;font-size:11px}
.btn{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:10px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.hero{padding:22px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.grid{display:grid;gap:12px}
@media(min-width:900px){.grid{grid-template-columns:1.1fr .9fr}}
.list{display:grid;gap:10px}
.item{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.muted{color:var(--muted)} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
</style>
</head>
<body>
<header>
<div class="logo"><span style="width:32px;height:32px;background:var(--green);color:#fff;display:grid;place-items:center;border-radius:9px">GT</span> Gabon Talent OS <span class="badge" id="modeBadge">DEMO</span></div>
</header>
<div class="hero grid">
<div class="card">
<h2>Offres d'emploi – 9 provinces</h2>
<div class="row"><input id="q" placeholder="Rechercher..."><select id="province"><option value="">Toutes provinces</option><option>Estuaire</option><option>Haut-Ogooué</option><option>Moyen-Ogooué</option><option>Ngounié</option><option>Nyanga</option><option>Ogooué-Ivindo</option><option>Ogooué-Lolo</option><option>Ogooué-Maritime</option><option>Woleu-Ntem</option></select><button class="btn primary" onclick="filtrer()">Filtrer</button></div>
<div id="offres" class="list" style="margin-top:14px"></div>
</div>
<div class="card">
<h2>Publier une offre</h2>
<input id="titre" placeholder="Titre"><input id="entreprise" placeholder="Entreprise"><select id="prov2"><option>Estuaire</option><option>Haut-Ogooué</option><option>Moyen-Ogooué</option><option>Ngounié</option><option>Nyanga</option><option>Ogooué-Ivindo</option><option>Ogooué-Lolo</option><option>Ogooué-Maritime</option><option>Woleu-Ntem</option></select><input id="contrat" placeholder="CDI / CDD / Stage"><textarea id="desc" placeholder="Description" rows="4"></textarea>
<button class="btn primary" style="margin-top:10px;width:100%" onclick="publierOffre()">Publier → Firebase</button>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

const CONFIG = {
  FIREBASE:{apiKey:"AIzaSyATIRQPYhVPFpId1v13zk4axeJA_IQ70",authDomain:"gabon-talent-os.firebaseapp.com",projectId:"gabon-talent-os",storageBucket:"gabon-talent-os.firebasestorage.app",messagingSenderId:"66563433244",appId:"1:66563433244:web:1c6e82435544d7a839ee59",measurementId:"G-7FVW7XZMC"},
};

let db, allJobs = [
  {titre:"Développeur Web", entreprise:"SEE G Gabon", province:"Estuaire", contrat:"CDI", description:"React / Firebase"},
  {titre:"Comptable", entreprise:"TotalEnergies", province:"Ogooué-Maritime", contrat:"CDI", description:"Port-Gentil"}
];
async function initFirebase(){
  const app = initializeApp(CONFIG.FIREBASE);
  db = getFirestore(app);
  const auth = getAuth(app);
  await signInAnonymously(auth);
  document.getElementById('modeBadge').textContent='CONNECTÉ FIREBASE';
  const snap = await getDocs(query(collection(db,"jobs"), orderBy("date","desc")));
  const fjobs = snap.docs.map(d=>d.data());
  allJobs = [...fjobs, ...allJobs];
  renderOffres(allJobs);
}
function renderOffres(list){
  document.getElementById('offres').innerHTML=list.map(j=>`<div class="item"><strong>${j.titre}</strong> – ${j.entreprise} <span class="badge">${j.province}</span><p>${j.description}</p></div>`).join('');
}
window.filtrer=()=>{const q=document.getElementById('q').value.toLowerCase();const p=document.getElementById('province').value;renderOffres(allJobs.filter(j=>(!q||j.titre.toLowerCase().includes(q))&&(!p||j.province===p)));};
window.publierOffre=async()=>{
  const job={titre:titre.value, entreprise:entreprise.value, province:prov2.value, contrat:contrat.value, description:desc.value, date:Date.now()};
  await addDoc(collection(db,"jobs"), job); alert("Publié dans Firebase !"); allJobs.unshift(job); renderOffres(allJobs);
};
initFirebase().catch(()=>{renderOffres(allJobs); document.getElementById('modeBadge').textContent='MODE LOCAL';});
</script>
</body>
</html>
